{% extends "base.html" %}
{% block title %}Sign in - Foundry Admin{% endblock %}
{% block content %}
<div class="panel">
    <form method="post">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Sign in</button>
    </form>
    <p style="margin-top:1.25rem;"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
</div>
{% endblock %}
