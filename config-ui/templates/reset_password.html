{% extends "base.html" %}
{% block title %}Reset password - Foundry Admin{% endblock %}
{% block content %}
<h1>Reset password</h1>
<div class="panel">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
            <label for="code">Reset code</label>
            <input type="text" id="code" name="code" autofocus required>
            <div class="help">From the email sent via <a href="{{ url_for('forgot_password') }}">Forgot password</a>.</div>
        </div>
        <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" minlength="8" required>
        </div>
        <div class="field">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" minlength="8" required>
        </div>
        <button type="submit">Reset password</button>
    </form>
    <p style="margin-top:1.25rem;"><a href="{{ url_for('login') }}">&larr; Back to sign in</a></p>
</div>
{% endblock %}
