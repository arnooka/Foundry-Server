# Internal-only metrics endpoint for the admin dashboard's "Requests Served"
# stat. Deliberately not published as a host port in docker-compose.yml, so
# it's only reachable from other containers on foundry-net (e.g. config-ui),
# never from the LAN or the Cloudflare Tunnel. That's what keeps this from
# being a public information leak, not an allow/deny list here.
server {
    listen 8081;
    server_name _;

    location /nginx_status {
        access_log off;
        stub_status;
    }
}
