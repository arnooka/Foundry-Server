# Structured per-request log for the dashboard's traffic charts (Request Types
# pie chart + Network Activity graph, see services/docker_control.py's
# get_traffic_stats). The leading "_" is deliberate: nginx includes conf.d/*.conf
# alphabetically, and log_format has to be defined before any access_log
# directive references it. "_" sorts before every letter, so this file loads
# first regardless of what the others are named.
#
# $msec is nginx's built-in epoch-seconds.milliseconds variable, used directly
# so the Python side doesn't need to parse dates.
log_format traffic_json escape=json
    '{"time":$msec,"vhost":"$vhost_label","method":"$request_method","status":$status,"bytes":$body_bytes_sent}';
