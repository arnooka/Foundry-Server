# Admin UI vhost. Bound to the LAN via the host port mapping in
# docker-compose.yml, and - if you've added a Public Hostname for it on the
# Cloudflare Tunnel, see docs/cloudflare-tunnel-setup.md - reachable from the
# internet too. Put a Cloudflare Access policy on that hostname; nginx/Flask
# auth alone shouldn't be the only thing standing in front of a vhost that
# can recreate containers over the Docker socket.

# Real client IP as seen by Cloudflare's edge (cloudflared forwards it
# unmodified). Falls back to $remote_addr for direct LAN access, where the
# header is never set.
map $http_cf_connecting_ip $admin_real_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# Backstop for app.py's own (IP-keyed, longer-window) login lockout - this
# one resets on its own and just slows a brute-force script down at the
# proxy layer before it reaches Flask at all.
limit_req_zone $admin_real_ip zone=admin_login:10m rate=5r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    set $vhost_label "admin";
    access_log /dev/stdout combined;
    access_log /var/log/app-traffic/traffic.json.log traffic_json;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /login {
        limit_req zone=admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $admin_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Excluded from the traffic log so the dashboard's own 6-second polling
    # loop (and its CSS/JS assets) don't drown out real traffic in the
    # Request Types / Network Activity charts. See services/docker_control.py.
    location = /api/metrics {
        access_log off;
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
    }
    location /static/ {
        access_log off;
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $admin_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
