# Admin UI vhost. Only bound to the LAN (via the host port mapping in
# docker-compose.yml). Never add this port as a Cloudflare Tunnel destination
# or forward it through any other tunnel/router rule.
server {
    listen 8080;
    server_name _;

    set $vhost_label "admin";
    access_log /dev/stdout combined;
    access_log /var/log/app-traffic/traffic.json.log traffic_json;

    # Excluded from the traffic log so the dashboard's own 6-second polling
    # loop (and its CSS/JS assets) don't drown out real traffic in the
    # Request Types / Network Activity charts. See services/docker_control.py.
    location = /api/metrics {
        access_log off;
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
    }
    location /static/ {
        access_log off;
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://config-ui:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
